# Re-measures everything on the 2nd of every month and publishes the website to GitHub Pages.
# Enable it in the repo: Settings -> Pages -> Source: GitHub Actions.
name: Monthly refresh

on:
  schedule:
    - cron: "30 3 2 * *"   # 09:00 IST on the 2nd of each month
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: wikimedia-cache-${{ github.run_id }}
          restore-keys: wikimedia-cache-
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m bhashagap run
      - name: Commit the new dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed site/data
          git diff --cached --quiet || git commit -m "Monthly data refresh"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
